workflows:
  android-release:
    name: Nukuconnect Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - nukuconnect_keystore
      groups:
        - google_play   # (optionnel) pour publication automatique sur Play Store
      vars:
        PACKAGE_NAME: "app.lovable.7cbf6140856746c7888328d929a2bdd4"
      node: 20
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Vérifier le keystore et l'alias (nukuconnect_keystore / nukuconnect)
        script: |
          set -e
          EXPECTED_ALIAS="nukuconnect"
          EXPECTED_REF="nukuconnect_keystore"

          echo "🔍 Vérification de la configuration de signature Android..."

          # 1) Vérifier que Codemagic a bien injecté les variables du keystore
          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "❌ ERREUR: Aucun keystore trouvé."
            echo "   → Allez dans Codemagic → Teams → Personal account → Code signing identities"
            echo "   → Android keystores → ajoutez un keystore avec Reference name = '$EXPECTED_REF'"
            exit 1
          fi
          echo "✅ Fichier keystore présent : $CM_KEYSTORE_PATH"

          if [ -z "$CM_KEYSTORE_PASSWORD" ]; then
            echo "❌ ERREUR: CM_KEYSTORE_PASSWORD vide. Vérifiez le mot de passe du keystore dans Codemagic."
            exit 1
          fi
          if [ -z "$CM_KEY_PASSWORD" ]; then
            echo "❌ ERREUR: CM_KEY_PASSWORD vide. Vérifiez le mot de passe de la clé dans Codemagic."
            exit 1
          fi
          if [ -z "$CM_KEY_ALIAS" ]; then
            echo "❌ ERREUR: CM_KEY_ALIAS vide. Vérifiez le champ Key alias dans Codemagic."
            exit 1
          fi

          # 2) Vérifier que l'alias attendu correspond
          if [ "$CM_KEY_ALIAS" != "$EXPECTED_ALIAS" ]; then
            echo "❌ ERREUR: Alias incorrect."
            echo "   Attendu : '$EXPECTED_ALIAS'"
            echo "   Reçu    : '$CM_KEY_ALIAS'"
            echo "   → Corrigez le Key alias dans Codemagic ou modifiez EXPECTED_ALIAS dans codemagic.yaml"
            exit 1
          fi
          echo "✅ Key alias correct : $CM_KEY_ALIAS"

          # 3) Vérifier que le keystore contient bien l'alias et que les mots de passe fonctionnent
          if ! keytool -list -keystore "$CM_KEYSTORE_PATH" \
                -storepass "$CM_KEYSTORE_PASSWORD" \
                -alias "$EXPECTED_ALIAS" > /tmp/keystore_check.log 2>&1; then
            echo "❌ ERREUR: Impossible de lire l'alias '$EXPECTED_ALIAS' dans le keystore."
            echo "   Causes possibles :"
            echo "   • Mot de passe du keystore (storepass) incorrect"
            echo "   • L'alias '$EXPECTED_ALIAS' n'existe pas dans ce keystore"
            cat /tmp/keystore_check.log
            exit 1
          fi
          echo "✅ Alias '$EXPECTED_ALIAS' trouvé dans le keystore."

          # 4) Vérifier la validité du certificat (date d'expiration)
          EXPIRY=$(keytool -list -v -keystore "$CM_KEYSTORE_PATH" \
                    -storepass "$CM_KEYSTORE_PASSWORD" \
                    -alias "$EXPECTED_ALIAS" 2>/dev/null \
                    | grep -i "until:" | head -1 | sed 's/.*until: //')
          if [ -n "$EXPIRY" ]; then
            echo "📅 Certificat valide jusqu'au : $EXPIRY"
          fi

          # 5) Calculer et afficher l'empreinte SHA-256 (utile pour Play Console)
          SHA256=$(keytool -list -v -keystore "$CM_KEYSTORE_PATH" \
                    -storepass "$CM_KEYSTORE_PASSWORD" \
                    -alias "$EXPECTED_ALIAS" 2>/dev/null \
                    | grep "SHA256:" | head -1 | awk '{print $2}')
          if [ -n "$SHA256" ]; then
            echo "🔑 Empreinte SHA-256 : $SHA256"
            echo "   → Conservez cette empreinte (utile pour Google Play & Firebase)"
          fi

          echo "✅ Toutes les vérifications du keystore sont passées. Lancement de la compilation..."

      - name: Installer les dépendances npm
        script: |
          npm install

      - name: Builder l'application web (Vite)
        script: |
          npm run build

      - name: Préparer la plateforme Android (Capacitor)
        script: |
          # Retire le serveur de dev pour la prod (build offline embarqué)
          node -e "
            const fs = require('fs');
            const f = 'capacitor.config.ts';
            let c = fs.readFileSync(f, 'utf8');
            c = c.replace(/server:\s*{[^}]*},?/s, '');
            fs.writeFileSync(f, c);
          "
          npx cap add android || true
          npx cap sync android

      - name: Configurer le numéro de version Android
        script: |
          cd android/app
          # Incrémente automatiquement le versionCode à chaque build
          BUILD_NUMBER=$(($(date +%s) / 60))
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" build.gradle
          sed -i.bak "s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD_NUMBER\"/" build.gradle

      - name: Compiler l'AAB signé
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - VOTRE_EMAIL@example.com   # ⚠️ Remplacez par votre vraie adresse
        notify:
          success: true
          failure: true

      # ── Publication automatique sur Play Console (optionnel) ──
      # Décommentez après avoir créé le compte de service Google Play
      # et ajouté GCLOUD_SERVICE_ACCOUNT_CREDENTIALS dans le groupe "google_play"
      #
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal       # internal | alpha | beta | production
      #   submit_as_draft: true
