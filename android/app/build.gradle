apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: project(':capacitor-android').projectDir.absolutePath + '/capacitor.gradle'

android {
    namespace 'app.lovable.nukuconnect7cbf6140'
    compileSdkVersion 36
    
    defaultConfig {
        applicationId "app.lovable.7cbf6140856746c7888328d929a2bdd4"
        minSdkVersion 22
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('CM_KEYSTORE_PATH') ?: 'keystore.jks')
            storePassword System.getenv('CM_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CM_KEY_ALIAS') ?: 'nukuconnect'
            keyPassword System.getenv('CM_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.10.1'
    
    // Capacitor
    implementation 'com.getcapacitor:capacitor-android:5.7.0'
    implementation 'com.getcapacitor:capacitor-core:5.7.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
