name: SEO & routing integrity

# Runs on every push and PR — fails the build if any of the following
# regress:
#   - sitemap.xml, robots.txt, canonical host consistency
#   - React <Route> ↔ sitemap coverage (no orphan routes, no dead entries)
#   - internal <Link>/<a href> targets (no links to non-existent routes)
#   - share-og URL builders (WhatsApp/Facebook previews never fall back
#     to the homepage)
#   - full unit / component / geo test suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    name: Routes, sitemap, links & share preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sitemap / robots / route-integrity tests
        run: bunx vitest run src/__tests__/routes-integrity.test.ts

      - name: Share-og E2E contract (URL builders + optional live check)
        run: bunx vitest run src/__tests__/share-og.e2e.test.ts

      - name: Social SEO tags test
        run: bunx vitest run src/components/SEO.social.test.tsx

      - name: Geo & distance tests
        run: bunx vitest run src/lib/__tests__/geo.test.ts

      - name: Internal link crawler (no 404s in <Link> / <a href>)
        run: node scripts/check-internal-links.mjs

      - name: TypeScript typecheck
        run: bunx tsgo --noEmit
