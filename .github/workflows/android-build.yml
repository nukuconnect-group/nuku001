name: Android signed build + Verify API 36

on:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (ex: 1.0.3). Leave empty for auto."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android AAB & APK (signed) + Verify API 36
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build web application
        run: npm run build

      - name: Sync Android platform
        run: npx cap sync android

      - name: Prepare Android config
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Gradle modules
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew projects

      - name: Build release AAB & APK (force :app)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:tasks --all > gradle-app-tasks.txt || true
          ./gradlew clean
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Locate generated Android packages
        id: locate_outputs
        run: |
          set -e
          find android -type f | sort > android/android-files.txt || true

          AAB_FILE=$(find android -type f -path "*/app/build/outputs/*" -name "*.aab" | head -1 || true)
          APK_FILE=$(find android -type f -path "*/app/build/outputs/*" -name "*.apk" | head -1 || true)

          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find android -type f -name "*.aab" | head -1 || true)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -type f -name "*.apk" | head -1 || true)
          fi

          echo "aab=$AAB_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify outputs are present
        run: |
          set -e
          AAB="${{ steps.locate_outputs.outputs.aab }}"
          APK="${{ steps.locate_outputs.outputs.apk }}"

          if [ -z "$AAB" ] || [ ! -f "$AAB" ]; then
            echo "No AAB file found"
            find android -type f | grep -E "(outputs|bundle|apk|aab)" || true
            exit 1
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No APK file found"
            find android -type f | grep -E "(outputs|bundle|apk|aab)" || true
            exit 1
          fi

      - name: Rename outputs
        id: rename
        run: |
          set -e
          AAB="${{ steps.locate_outputs.outputs.aab }}"
          APK="${{ steps.locate_outputs.outputs.apk }}"

          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="run${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets
          cp "$AAB" "release-assets/nuku-${VERSION}.aab"
          cp "$APK" "release-assets/nuku-${VERSION}.apk"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            release-assets/*.aab
            release-assets/*.apk
            android/build.log
            android/gradle-app-tasks.txt
            android/android-files.txt
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ steps.rename.outputs.version }}
          name: Android build ${{ steps.rename.outputs.version }}
          body: |
            Automatic Android build (AAB + APK)
            - Commit: ${{ github.sha }}
            - Run: ${{ github.run_id }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.aab
            release-assets/*.apk
