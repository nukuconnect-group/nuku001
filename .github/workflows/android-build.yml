name: Android signed build

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (ex: 1.0.3). Laisser vide pour auto.'
        required: false
        type: string

jobs:
  build:
    name: Build Android AAB & APK (signed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Android platform (production, sans live-reload)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Prepare Android config (SDK 36, App Links, version)
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore décodé et prêt"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Aucun keystore : build non signé"
          fi

      - name: Build release AAB & APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify outputs (app-release.aab / app-release.apk)
        run: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB manquant à $AAB"
            ls -la android/app/build/outputs/ 2>/dev/null || echo "Répertoire outputs introuvable"
            exit 1
          fi
          
          if [ ! -f "$APK" ]; then
            echo "❌ APK manquant à $APK"
            ls -la android/app/build/outputs/ 2>/dev/null || echo "Répertoire outputs introuvable"
            exit 1
          fi
          
          AAB_SIZE=$(du -h "$AAB" | cut -f1)
          APK_SIZE=$(du -h "$APK" | cut -f1)
          echo "✅ AAB : $AAB_SIZE"
          echo "✅ APK : $APK_SIZE"

      - name: Verify targetSdk = 36
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools/36.0.0" -name aapt2 | head -1)
          
          if [ -z "$AAPT" ]; then
            echo "⚠️ aapt2 non trouvé, vérification SDK sautée"
          else
            "$AAPT" dump badging "$APK" > /tmp/badging.txt 2>&1 || true
            if grep -q "targetSdkVersion:'36'" /tmp/badging.txt; then
              echo "✅ targetSdk 36 (Android 16) conforme Google Play"
            else
              echo "⚠️ Avertissement : targetSdk différent de 36"
              cat /tmp/badging.txt | head -20
            fi
          fi

      - name: Verify AAB signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          
          if [ ! -f "$AAB" ]; then
            echo "⚠️ AAB non trouvé, vérification de signature sautée"
            exit 0
          fi
          
          EXPECTED=$(keytool -list -v -keystore "$HOME/release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>/dev/null \
            | grep "SHA256:" | head -1 | awk '{print $2}')
          
          mkdir -p /tmp/aab
          unzip -o -q "$AAB" "META-INF/*" -d /tmp/aab 2>/dev/null || true
          
          CERT=$(find /tmp/aab/META-INF -type f \( -name "*.RSA" -o -name "*.EC" -o -name "*.DSA" \) | head -1)
          
          if [ -z "$CERT" ]; then
            echo "✅ AAB généré (signature non vérifiable hors Play Store)"
          else
            ACTUAL=$(keytool -printcert -file "$CERT" 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $2}')
            if [ "$EXPECTED" = "$ACTUAL" ]; then
              echo "✅ AAB signé correctement — prêt pour Google Play"
            else
              echo "⚠️ Signature trouvée mais ne correspond pas au keystore"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Display build summary
        if: always()
        run: |
          echo "========================================="
          echo "📦 BUILD ANDROID TERMINÉ"
          echo "========================================="
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB : android/app/build/outputs/bundle/release/app-release.aab"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK : android/app/build/outputs/apk/release/app-release.apk"
          fi
          echo "========================================="
