name: Android signed build

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (ex: 1.0.3). Laisser vide pour auto.'
        required: false
        type: string

jobs:
  build:
    name: Build Android AAB & APK (signed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Android platform (production, sans live-reload)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Prepare Android config (SDK 36, App Links, version)
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > "$HOME/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore décodé"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Aucun keystore : build non signé"
          fi

      - name: Build release AAB & APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify outputs (app-release.aab / app-release.apk)
        run: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$AAB" ] || { echo "❌ $AAB manquant"; exit 1; }
          [ -f "$APK" ] || { echo "❌ $APK manquant"; exit 1; }
          echo "📦 AAB : $(du -h "$AAB" | cut -f1) — APK : $(du -h "$APK" | cut -f1)"

      - name: Verify targetSdk = 36
        run: |
          set -e
          AAPT=$(find "$ANDROID_HOME/build-tools/36.0.0" -name aapt2 | head -1)
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk > /tmp/badging.txt
          grep -E "targetSdkVersion:'36'" /tmp/badging.txt || { echo "❌ targetSdk != 36"; cat /tmp/badging.txt | head -20; exit 1; }
          echo "✅ targetSdk 36 (Android 16) conforme Google Play"

      - name: Verify AAB signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -e
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          EXPECTED=$(keytool -list -v -keystore "$HOME/release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>/dev/null \
            | grep "SHA256:" | head -1 | awk '{print $2}')
          mkdir -p /tmp/aab && unzip -o -q "$AAB" "META-INF/*" -d /tmp/aab
          CERT=$(find /tmp/aab/META-INF -type f \( -name "*.RSA" -o -name "*.EC" -o -name "*.DSA" \) | head -1)
          [ -n "$CERT" ] || { echo "❌ AAB non signé"; exit 1; }
          ACTUAL=$(keytool -printcert -file "$CERT" | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "Attendu : $EXPECTED"
          echo "Trouvé  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "❌ Signature non conforme"; exit 1; }
          echo "✅ AAB signé avec l'alias attendu — prêt pour Google Play"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
