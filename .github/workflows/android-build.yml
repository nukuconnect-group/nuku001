name: Android unsigned AAB build + Verify API 36

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (ex: 1.0.3). Laisser vide pour auto.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android AAB unsigned + Verify API 36
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build web application
        run: npm run build

      - name: Sync Android platform (production, sans live-reload)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Prepare Android config (SDK 36, App Links, version)
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}

      - name: Verify Android configuration files
        run: |
          echo "=== Vérification des fichiers Android ==="
          echo ""
          echo "📄 variables.gradle :"
          grep -E "(compileSdk|targetSdk|minSdk)" android/variables.gradle || true
          echo ""
          echo "📄 app/build.gradle :"
          grep -E "(targetSdkVersion|compileSdk)" android/app/build.gradle | head -5 || true

      - name: Build release AAB (unsigned)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify and rename unsigned AAB
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          UNSIGNED_AAB=android/app/build/outputs/bundle/release/app-release-unsigned.aab
          
          if [ -f "$AAB" ]; then
            mv "$AAB" "$UNSIGNED_AAB"
            AAB_SIZE=$(du -h "$UNSIGNED_AAB" | cut -f1)
            echo "✅ AAB unsigned généré : $AAB_SIZE"
          else
            echo "❌ AAB manquant à $AAB"
            echo "📂 Contenu android/app/build/outputs/ :"
            ls -la android/app/build/outputs/ 2>/dev/null || echo "Répertoire introuvable"
            exit 1
          fi

      - name: Extract and verify AAB manifest
        run: |
          echo "=== VÉRIFICATION DU MANIFEST DE L'AAB ==="
          echo ""
          
          AAB=android/app/build/outputs/bundle/release/app-release-unsigned.aab
          
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB non trouvé, vérification du manifest impossible"
            exit 1
          fi
          
          mkdir -p /tmp/aab_check
          unzip -q -o "$AAB" "BundleConfig.pb" -d /tmp/aab_check 2>/dev/null || true
          
          # Extraction du manifest dans l'AAB
          unzip -q -o "$AAB" "base/manifest/AndroidManifest.xml" -d /tmp/aab_check 2>/dev/null || true
          
          if [ -f "/tmp/aab_check/base/manifest/AndroidManifest.xml" ]; then
            echo "✅ AndroidManifest.xml trouvé dans l'AAB"
            grep -o 'android:targetSdkVersion="[0-9]*"' /tmp/aab_check/base/manifest/AndroidManifest.xml || echo "Pas de targetSdkVersion lisible"
          fi
          
          echo ""
          echo "📦 AAB unsigned prêt pour signature manuelle"

      - name: Verify AAB is unsigned
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release-unsigned.aab
          
          if [ ! -f "$AAB" ]; then
            echo "❌ AAB non trouvé, vérification impossible"
            exit 1
          fi
          
          echo "=== VÉRIFICATION ABSENCE DE SIGNATURE ==="
          mkdir -p /tmp/aab
          unzip -o -q "$AAB" "META-INF/*" -d /tmp/aab 2>/dev/null || true
          
          CERT=$(find /tmp/aab/META-INF -type f \( -name "*.RSA" -o -name "*.EC" -o -name "*.DSA" \) | head -1)
          
          if [ -z "$CERT" ]; then
            echo "✅ AAB non signé confirmé"
          else
            echo "❌ Signature trouvée dans l'AAB"
            find /tmp/aab/META-INF -type f
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned-aab
          path: |
            android/app/build/outputs/bundle/release/app-release-unsigned.aab
          if-no-files-found: error
          retention-days: 30

      - name: Display build summary
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "📦 BUILD ANDROID AAB UNSIGNED TERMINÉ"
          echo "========================================="
          echo ""
          if [ -f "android/app/build/outputs/bundle/release/app-release-unsigned.aab" ]; then
            AAB_SIZE=$(du -h "android/app/build/outputs/bundle/release/app-release-unsigned.aab" | cut -f1)
            echo "✅ AAB unsigned : $AAB_SIZE"
            echo "   Chemin : android/app/build/outputs/bundle/release/app-release-unsigned.aab"
            echo ""
          fi
          echo "========================================="
          echo "🎯 CIBLAGE API : Android 16 (API 36)"
          echo "✅ AAB NON SIGNÉ, SIGNATURE MANUELLE POSSIBLE"
          echo "========================================="
          echo ""
          echo "📍 Récupérez vos artifacts ici :"
          echo "   Actions → Latest Run → Artifacts → android-release-unsigned-aab"
          echo ""
