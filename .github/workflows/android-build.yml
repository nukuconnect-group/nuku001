name: Android release (AAB + APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (ex: 1.2.0). Vide = auto'
        required: false
        default: ''
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    name: Build signed AAB & APK (SDK 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install--legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add & sync Android platform (production, sans live-reload)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Prepare Android config (SDK 36, App Links, version)
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}  
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore décodé"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Aucun keystore : build non signé"
          fi

      - name: Build release AAB & APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace


      - name: Verify AAB signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -e
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          [ -n "$AAB" ] || { echo "❌ Aucun AAB généré"; exit 1; }
          echo "📦 AAB : $AAB ($(du -h "$AAB" | cut -f1))"
          EXPECTED=$(keytool -list -v -keystore "$HOME/release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>/dev/null \
            | grep "SHA256:" | head -1 | awk '{print $2}')
          mkdir -p /tmp/aab && unzip -o -q "$AAB" "META-INF/*" -d /tmp/aab
          CERT=$(find /tmp/aab/META-INF -type f \( -name "*.RSA" -o -name "*.EC" -o -name "*.DSA" \) | head -1)
          [ -n "$CERT" ] || { echo "❌ AAB non signé"; exit 1; }
          ACTUAL=$(keytool -printcert -file "$CERT" | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "Attendu : $EXPECTED"
          echo "Trouvé  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "❌ Signature non conforme"; exit 1; }
          echo "✅ AAB signé avec l'alias attendu — prêt pour Google Play"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
