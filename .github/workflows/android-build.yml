name: Android signed build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android AAB & APK (signed)
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /tmp/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor (prepare Android project)
        run: npx cap sync android

      - name: Install Android SDK command line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          yes | $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Decode Android keystore (from secret ANDROID_KEYSTORE_BASE64)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $HOME/android-keystore.jks
          ls -l $HOME/android-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          if [ -f "$HOME/android-keystore.jks" ]; then
            echo "Using provided keystore to sign builds"
            ./gradlew bundleRelease assembleRelease \
              -Pandroid.injected.signing.store.file=$HOME/android-keystore.jks \
              -Pandroid.injected.signing.store.password=${ANDROID_KEYSTORE_PASSWORD} \
              -Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS} \
              -Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD}
          else
            echo "Keystore not provided: building unsigned releases"
            ./gradlew bundleRelease assembleRelease
          fi
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB & APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
