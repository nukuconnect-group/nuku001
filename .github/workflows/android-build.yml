name: Android signed build + Verify API 36

on:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (ex: 1.0.3). Leave empty for auto."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install JS deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Android config
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}

      - name: Decode keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew clean --no-daemon
          ./gradlew :app:bundleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
          ./gradlew :app:assembleRelease --stacktrace --info --no-daemon 2>&1 | tee -a build.log
          echo "=== LIST OUTPUTS ==="
          find . -type f | grep -E "(\.aab$|\.apk$|outputs|bundle|release)" | sort || true

      - name: Locate AAB/APK
        id: locate
        run: |
          set -e
          AAB="$(find android -type f -name '*.aab' | head -1 || true)"
          APK="$(find android -type f -name '*release*.apk' | head -1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find android -type f -name '*.apk' | head -1 || true)"
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "AAB=$AAB"
          echo "APK=$APK"

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release-assets
          AAB="${{ steps.locate.outputs.aab }}"
          APK="${{ steps.locate.outputs.apk }}"
          VERSION="${{ inputs.version_name }}"
          if [ -z "$VERSION" ]; then VERSION="run${{ github.run_number }}"; fi
          echo "VERSION=$VERSION"

          if [ -n "$AAB" ] && [ -f "$AAB" ]; then
            cp "$AAB" "release-assets/nuku-${VERSION}.aab"
          fi
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            cp "$APK" "release-assets/nuku-${VERSION}.apk"
          fi

          ls -la release-assets || true

      - name: Fail if no package generated
        run: |
          set -e
          AAB_COUNT=$(ls release-assets/*.aab 2>/dev/null | wc -l || true)
          APK_COUNT=$(ls release-assets/*.apk 2>/dev/null | wc -l || true)
          if [ "$AAB_COUNT" -eq 0 ] && [ "$APK_COUNT" -eq 0 ]; then
            echo "No AAB/APK generated"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            release-assets/*
            android/build.log
          if-no-files-found: warn
          retention-days: 30
