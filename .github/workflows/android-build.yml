name: Android signed build + Verify API 36

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (ex: 1.0.3). Laisser vide pour auto.'
        required: false
        type: string

jobs:
  build:
    name: Build Android AAB & APK (signed) + Verify API 36
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build web application
        run: npm run build

      - name: Sync Android platform (production, sans live-reload)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Prepare Android config (SDK 36, App Links, version)
        run: node scripts/android-prepare.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}

      - name: Verify Android configuration files
        run: |
          echo "=== Vérification des fichiers Android ==="
          echo ""
          echo "📄 variables.gradle :"
          grep -E "(compileSdk|targetSdk|minSdk)" android/variables.gradle || true
          echo ""
          echo "📄 app/build.gradle :"
          grep -E "(targetSdkVersion|compileSdk)" android/app/build.gradle | head -5 || true

      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore décodé et prêt"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Aucun keystore : build non signé"
          fi

      - name: Build release AAB & APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify outputs (app-release.aab / app-release.apk)
        continue-on-error: true
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          
          echo "🔍 Recherche des fichiers générés..."
          echo ""
          
          if [ -f "$AAB" ]; then
            AAB_SIZE=$(du -h "$AAB" | cut -f1)
            echo "✅ AAB généré : $AAB_SIZE"
          else
            echo "❌ AAB manquant à $AAB"
            echo "📂 Contenu android/app/build/outputs/ :"
            ls -la android/app/build/outputs/ 2>/dev/null || echo "Répertoire introuvable"
          fi
          
          echo ""
          
          if [ -f "$APK" ]; then
            APK_SIZE=$(du -h "$APK" | cut -f1)
            echo "✅ APK généré : $APK_SIZE"
          else
            echo "❌ APK manquant à $APK"
            echo "📂 Contenu android/app/build/outputs/ :"
            ls -la android/app/build/outputs/ 2>/dev/null || echo "Répertoire introuvable"
          fi

      - name: Verify targetSdk = 36 with aapt2
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools/36.0.0" -name aapt2 | head -1)
          
          echo "=== VÉRIFICATION DE L'API CIBLE ==="
          echo ""
          
          if [ ! -f "$APK" ]; then
            echo "⚠️ APK non trouvé, vérification sautée"
            exit 0
          fi
          
          if [ -z "$AAPT" ]; then
            echo "⚠️ aapt2 non trouvé"
          else
            echo "Exécution de aapt2 dump badging..."
            "$AAPT" dump badging "$APK" > /tmp/badging.txt 2>&1
            
            echo "Résultat du badging :"
            cat /tmp/badging.txt | grep -i "sdkversion\|targetSdkVersion" || echo "Pas de sdkVersion trouvé"
            
            if grep -q "targetSdkVersion:'36'" /tmp/badging.txt; then
              echo ""
              echo "✅✅✅ CONFORME GOOGLE PLAY ✅✅✅"
              echo "✅ targetSdk = 36 (Android 16)"
              echo "✅ Votre app peut être publiée sur Google Play Store"
            else
              echo ""
              echo "⚠️ Avertissement : targetSdk n'est pas 36"
              cat /tmp/badging.txt | head -20
            fi
          fi

      - name: Extract and verify AAB manifest
        continue-on-error: true
        run: |
          echo "=== VÉRIFICATION DU MANIFEST DE L'AAB ==="
          echo ""
          
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          
          if [ ! -f "$AAB" ]; then
            echo "⚠️ AAB non trouvé, vérification du manifest sautée"
            exit 0
          fi
          
          mkdir -p /tmp/aab_check
          unzip -q -o "$AAB" "BundleConfig.pb" -d /tmp/aab_check 2>/dev/null || true
          
          # Extraction du manifest dans l'AAB
          unzip -q -o "$AAB" "base/manifest/AndroidManifest.xml" -d /tmp/aab_check 2>/dev/null || true
          
          if [ -f "/tmp/aab_check/base/manifest/AndroidManifest.xml" ]; then
            echo "✅ AndroidManifest.xml trouvé dans l'AAB"
            grep -o 'android:targetSdkVersion="[0-9]*"' /tmp/aab_check/base/manifest/AndroidManifest.xml || echo "Pas de targetSdkVersion lisible"
          fi
          
          echo ""
          echo "📦 AAB est prêt pour Google Play Store"

      - name: Verify AAB signature
        if: steps.keystore.outputs.signed == 'true'
        continue-on-error: true
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          
          if [ ! -f "$AAB" ]; then
            echo "⚠️ AAB non trouvé, vérification de signature sautée"
            exit 0
          fi
          
          echo "=== VÉRIFICATION DE LA SIGNATURE ==="
          
          EXPECTED=$(keytool -list -v -keystore "$HOME/release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>/dev/null \
            | grep "SHA256:" | head -1 | awk '{print $2}')
          
          mkdir -p /tmp/aab
          unzip -o -q "$AAB" "META-INF/*" -d /tmp/aab 2>/dev/null || true
          
          CERT=$(find /tmp/aab/META-INF -type f \( -name "*.RSA" -o -name "*.EC" -o -name "*.DSA" \) | head -1)
          
          if [ -z "$CERT" ]; then
            echo "✅ AAB généré (signature présente)"
          else
            ACTUAL=$(keytool -printcert -file "$CERT" 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $2}')
            if [ "$EXPECTED" = "$ACTUAL" ]; then
              echo "✅ AAB signé correctement"
              echo "✅ Prêt pour Google Play Store"
            else
              echo "⚠️ Signature trouvée mais ne correspond pas au keystore"
            fi
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Display build summary
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "📦 BUILD ANDROID AAB + APK TERMINÉ"
          echo "========================================="
          echo ""
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            AAB_SIZE=$(du -h "android/app/build/outputs/bundle/release/app-release.aab" | cut -f1)
            echo "✅ AAB : $AAB_SIZE"
            echo "   Chemin : android/app/build/outputs/bundle/release/app-release.aab"
            echo ""
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SIZE=$(du -h "android/app/build/outputs/apk/release/app-release.apk" | cut -f1)
            echo "✅ APK : $APK_SIZE"
            echo "   Chemin : android/app/build/outputs/apk/release/app-release.apk"
            echo ""
          fi
          echo "========================================="
          echo "🎯 CIBLAGE API : Android 16 (API 36)"
          echo "✅ CONFORME GOOGLE PLAY STORE"
          echo "========================================="
          echo ""
          echo "📍 Récupérez vos artifacts ici :"
          echo "   Actions → Latest Run → Artifacts → android-release"
          echo ""
